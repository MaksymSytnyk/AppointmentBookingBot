name: verification
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: atelier_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://atelier:test-only-password@localhost:5432/atelier_test
      TEST_DATABASE_URL: postgresql+asyncpg://atelier:test-only-password@localhost:5432/atelier_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy appointment_booking
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.seed
      - run: uv run python -m scripts.seed
      - run: uv run pytest -q --cov=appointment_booking
