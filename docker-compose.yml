services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atelier}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
    - backend
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
    - backend
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atelier}
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - backend
  seed:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atelier}
    command:
    - python
    - -m
    - scripts.seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
    - tools
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - backend
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atelier}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - scripts.health
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
    - egress
    - backend
  worker:
    build: .
    command:
    - python
    - -m
    - appointment_booking.app.main
    - --worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atelier}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - scripts.health
      - --worker
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
    - egress
    - backend
volumes:
  postgres_data: null
  redis_data: null
networks:
  backend:
    internal: true
  egress: {}
